[build]
publish = "."
command = "echo 'Static site - no build step'"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/game.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/style.css"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/asset/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
